server {
    if ($host = www.cortexclip.eu.cc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = cortexclip.eu.cc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name clip.aqualibrya.my.id cortexclip.eu.cc www.cortexclip.eu.cc _;

    # Semua HTTP → HTTPS (kecuali ACME challenge)
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }




}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clip.aqualibrya.my.id cortexclip.eu.cc www.cortexclip.eu.cc;
    ssl_certificate /etc/letsencrypt/live/cortexclip.eu.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cortexclip.eu.cc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Anti mixed content: browser menaikkan setiap permintaan http://
    # pada halaman ini menjadi https:// sebelum dikirim.
    add_header Content-Security-Policy "upgrade-insecure-requests" always;
    # Kunjungan berikutnya langsung https (termasuk subdomain).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2G;

    # Backend API (:8787) — /api, /files, /health, /app/webhook
    location ~ ^/(api|files|health|app)(/|$) {
        limit_req zone=cc_api burst=40 nodelay;
        limit_conn cc_conn 40;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Supabase AUTH — paling ketat: ini pintu brute force sandi.
    location ~ ^/auth/ {
        limit_req zone=cc_auth burst=10 nodelay;
        limit_conn cc_conn 40;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Supabase (rest, storage, realtime) — /object/ = file upload/download
    location ~ ^/(rest|storage|realtime|object)/ {
        limit_req zone=cc_rest burst=60 nodelay;
        limit_conn cc_conn 40;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        client_max_body_size 2G;
    }

    # Frontend (Nitro :8080)
    location / {
        limit_req zone=cc_web burst=90 nodelay;
        limit_conn cc_conn 40;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }


}
