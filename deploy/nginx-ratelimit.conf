# --- PEMBATAS LAJU CortexClip (anti brute force / scraping / banjir) ---
# $binary_remote_addr = per alamat IP, hemat memori (4 byte vs teks).
# 10m zona ≈ 160.000 IP terlacak sekaligus.
limit_req_zone $binary_remote_addr zone=cc_auth:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=cc_api:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=cc_rest:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=cc_web:10m  rate=30r/s;
limit_conn_zone $binary_remote_addr zone=cc_conn:10m;

limit_req_status 429;
limit_conn_status 429;
# 'error' supaya penolakan tercatat di error.log dan bisa diaudit.
limit_req_log_level error;
